          <div class="profile-chips">
            <span class="pchip">Objetivo 3:06</span>
            <span class="pchip">${pr1000?('Mejor '+secToTime(pr1000.valor)):('Próx. test '+nextTestTxt)}</span>
          </div>
        </div>
      </div>
      <div class="profile-stats">
        <div class="pstat fcmax"><div class="pstat-v">${fcmax?fcmax.valor:'—'}</div><div class="pstat-l">FC máx</div></div>
        <div class="pstat fcreposo"><div class="pstat-v">${fcreposo?fcreposo.valor:'—'}</div><div class="pstat-l">FC reposo</div></div>
        <div class="pstat peso"><div class="pstat-v">${peso?peso.valor+'<small>kg</small>':'—'}</div><div class="pstat-l">Peso</div></div>
      </div>
    </div>`;
}
let zonasOpen = false;
function toggleZonas(){
  zonasOpen = !zonasOpen;
  renderZonasCard();
}
function renderZonasCard(){
  const fcmax = DB.fcmax.length ? DB.fcmax[DB.fcmax.length-1].valor : null;
  const names = ['Recuperación','Rodaje fácil','Medio','Umbral','Máximo'];
  let resumen, body;
  if(!fcmax){
    resumen = 'Añade tu FC máxima en Datos corporales';
    body = `<div class="empty-mini" style="padding:0 16px 16px">Sin FC máxima configurada</div>`;
  } else {
    const ranges = zonasFromFCMax(fcmax);
    resumen = `Z2 rodaje ${ranges[1][0]}-${ranges[1][1]} · Z5 series ${ranges[4][0]}-${ranges[4][1]}`;
    body = ranges.map(([a,b],i)=>`
      <div class="zona-row2">
        <span class="etapa-badge z${i+1}">Z${i+1}</span>
        <div><div class="zr-name">${names[i]}</div></div>
        <span class="zr-rango">${a}–${b}</span>
      </div>`).join('');
  }
  document.getElementById('fisico-zonas').innerHTML = `
    <div class="glass hist-session">
      <div class="hist-hdr tap" onclick="toggleZonas()">
        <div>
          <div class="hist-date">Zonas de frecuencia</div>
          <div class="hist-meta"><span class="hist-chip">${resumen}</span></div>
        </div>
        <div class="hist-controls"><button class="toggle-btn">${zonasOpen?'⌄':'›'}</button></div>
      </div>
      <div class="hist-body ${zonasOpen?'open':''}">${body}</div>
    </div>`;
}
function macroStyleBlock(tipo, titulo, unidad, iconSvg, iconColorStyle){
  const arr = tipo==='fcmax'?DB.fcmax:tipo==='fcreposo'?DB.fcreposo:DB.peso;
  const last = arr[arr.length-1];
  const hist = arr.slice(-5).reverse().map(r=>`<div class="fisico-hist-row"><span>${fmtDateShort(r.fecha)}</span><b>${r.valor} ${unidad}</b></div>`).join('');
  return `
    <div class="fisico-block" style="padding:0">
      <div class="sec-hdr">
        <div class="sec-icon" style="${iconColorStyle}">${iconSvg}</div>
        <div><div class="sec-title">${titulo}</div><div class="sec-sub">${last?last.valor+' '+unidad+' · '+fmtDateShort(last.fecha):'Sin registros'}</div></div>
      </div>
      <div class="sec-body">
        <div class="fisico-hist">${hist || '<div class="fisico-hist-row"><span>Sin registros</span></div>'}</div>
        <div class="f-row" style="margin-top:10px">
          <input class="f-input" type="date" id="fis-${tipo}-fecha" value="${todayISO()}" style="flex:1">
          <input class="f-input" type="number" id="fis-${tipo}-valor" placeholder="${unidad}" style="max-width:80px">
          <button class="f-btn tap" onclick="addFisico('${tipo}')">Guardar</button>
        </div>
      </div>
    </div>`;
}
function renderFisico(){
  renderPerfilFisico();
  renderZonasCard();
  document.getElementById('fisico-peso').innerHTML = macroStyleBlock('peso','Peso','kg',
    '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="7" r="3"/><path d="M5 21v-2a7 7 0 0114 0v2"/></svg>',
    'background:rgba(182,255,46,0.08);border-color:rgba(182,255,46,0.22)');
  document.getElementById('fisico-fcmax').innerHTML = macroStyleBlock('fcmax','FC máxima','ppm',
    '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
    'background:rgba(255,69,58,0.08);border-color:rgba(255,69,58,0.22)');
  document.getElementById('fisico-fcreposo').innerHTML = macroStyleBlock('fcreposo','FC en reposo','ppm',
    '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--blue2)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
    'background:rgba(41,121,255,0.08);border-color:rgba(41,121,255,0.22)');
}

/* ============================================================
   AJUSTES
   ============================================================ */
function renderAjustes(){
  document.getElementById('ajustes-datos').innerHTML = `
    <div class="sett-group glass">
      <div class="sett-group-title">Datos</div>
      <div class="sett-row tap" onclick="exportData()">
        <div class="sett-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><line x1="12" y1="3" x2="12" y2="15"/><polyline points="17 8 12 3 7 8"/></svg></div>
        <span>Exportar datos</span>
      </div>
      <div class="sett-row tap" onclick="document.getElementById('import-file').click()">
        <div class="sett-icon" style="background:rgba(182,255,46,0.08);border-color:rgba(182,255,46,0.22)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></div>
        <span>Importar datos</span>
      </div>
      <input type="file" id="import-file" accept="application/json" style="display:none" onchange="importData(this.files[0])">
    </div>
  `;
  document.getElementById('ajustes-prefs').innerHTML = `
    <div class="sett-group glass">
      <div class="sett-group-title">Preferencias</div>
      <div class="sett-row tap" onclick="toggleRitmoView()">
        <div class="sett-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M7 7h11M18 7l-3-3M18 7l-3 3M17 17H6M6 17l3 3M6 17l3-3"/></svg></div>
        <span>Mostrar ritmo como&nbsp;&nbsp;<span style="font-size:11px;color:var(--text-3);font-family:var(--font-mono);font-weight:500;">${DB.pref.ritmo==='pace'?'Ritmo':'Tiempo'}</span></span>
      </div>
    </div>
  `;
  document.getElementById('ajustes-peligro').innerHTML = `
    <div class="sett-group glass">
      <div class="sett-group-title">Peligro</div>
      <div class="sett-row danger tap" onclick="resetData()">
        <div class="sett-icon" style="background:rgba(255,69,58,0.08);border-color:rgba(255,69,58,0.22)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg></div>
        <span>Borrar todos los datos</span>
      </div>
    </div>
  `;
  const verEl = document.getElementById('app-version');
  if(verEl) verEl.textContent = `v${APP_VERSION} · ${APP_BUILD_DATE}`;
}
function exportData(){
  const blob = new Blob([JSON.stringify({sesiones:DB.sesiones, plan:DB.plan, fcmax:DB.fcmax, fcreposo:DB.fcreposo, peso:DB.peso, pref:DB.pref}, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `km-tracker-backup-${todayISO()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}
function importData(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const d = JSON.parse(reader.result);
      if(d.sesiones) DB.sesiones = d.sesiones;
      if(d.plan) DB.plan = d.plan;
      if(d.fcmax) DB.fcmax = d.fcmax;
      if(d.fcreposo) DB.fcreposo = d.fcreposo;
      if(d.peso) DB.peso = d.peso;
      if(d.pref) DB.pref = d.pref;
      persist();
      toast('Datos importados');
      renderCurrent();
    }catch(e){ toast('Archivo no válido'); }
  };
  reader.readAsText(file);
}
function resetData(){
  if(!confirm('Esto borra todos los datos de la app. ¿Continuar?')) return;
  DB.sesiones = TESTS_DEFAULT.map(s=>({...s,id:uid()}));
  DB.plan = JSON.parse(JSON.stringify(PLAN_DEFAULT));
  DB.fcmax = JSON.parse(JSON.stringify(FCMAX_DEFAULT));
  DB.fcreposo = JSON.parse(JSON.stringify(FCREPOSO_DEFAULT));
  DB.peso = [];
  DB.pref = {ritmo:'pace'};
  persist();
  toast('Datos reiniciados');
  renderCurrent();
}

/* ============================================================
   INIT
   ============================================================ */
renderCurrent();
updateNavIndicator(document.querySelector('.nav-btn.active'));

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{ location.reload(); });
}
</script>
