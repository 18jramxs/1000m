<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="apple-touch-icon" href="1000m.jpeg">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KM Tracker">
<meta name="theme-color" content="#050507">
<title>KM Tracker</title>

<!-- Bebas Neue — mismo sistema visual que gym-tracker -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

<style>
/* ============================================================
   KM TRACKER — v6 (antes "1000 m Tracker")
   Mismo sistema visual que gym-tracker, componentes reales
   copiados tal cual: cabecera, today-hero, day-grid, vol-info-btn,
   emom-card, profile-card con pstat, etapa-badge, macros-grid.
   De la etapa "estudio" solo quedan tres piezas, re-tematizadas:
   el reparto de contenido de Físico, las filas de Sesiones
   (punto + chevron) y el rojo de ELIMINAR en Ajustes.
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}

:root{
  --bg:#050507; --bg-2:#0a0a0c; --bg-3:#131318;
  --bg-card:rgba(255,255,255,0.045); --bg-card-2:rgba(255,255,255,0.07);
  --bg-input:rgba(255,255,255,0.06); --bg-glass-strong:rgba(20,20,26,0.55);

  --border:rgba(255,255,255,0.08); --border-2:rgba(255,255,255,0.14); --border-3:rgba(255,255,255,0.22);

  --text:#ffffff; --text-2:rgba(255,255,255,0.62); --text-3:rgba(255,255,255,0.54); --text-4:rgba(255,255,255,0.18);

  --blue:#2979ff; --blue2:#6ea8ff; --blue-bg:rgba(41,121,255,0.13);
  --green:#b6ff2e; --green-bg:rgba(182,255,46,0.12);
  --red:#ff453a; --red-bg:rgba(255,69,58,0.12);
  --amber:#ffd60a; --amber-bg:rgba(255,214,10,0.12);
  --orange:#ff6b00; --orange-bg:rgba(255,107,0,0.13);
  --pink:#ff2d92; --cyan:#5ac8fa;

  /* tipos de sesión — mapeados a los acentos del gym-tracker */
  --c-series:var(--blue); --c-rodaje:var(--green); --c-velocidad:var(--orange); --c-test:var(--amber); --c-danger:var(--red);

  --glass:blur(28px) saturate(180%); --glass-strong:blur(44px) saturate(200%);

  --r-xs:10px; --r-sm:14px; --r:20px; --r-lg:26px; --r-pill:100px;

  --shadow-card:0 8px 24px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
  --shadow-card-lg:0 18px 50px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.08);
  --shadow-nav:0 14px 40px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.08);

  --font-sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Segoe UI",sans-serif;
  --font-disp:"Bebas Neue","Anton","SF Pro Display",system-ui,sans-serif;
  --font-mono:"SF Mono",ui-monospace,"Roboto Mono",Menlo,monospace;

  --ease-out-soft:cubic-bezier(0.22,1,0.36,1); --ease-pop:cubic-bezier(0.16,1,0.3,1);
  --ease-spring:cubic-bezier(0.34,1.56,0.64,1); --ease-drawer:cubic-bezier(0.32,0.72,0,1);
  color-scheme:dark;
}

html,body{background:var(--bg);overscroll-behavior-y:none;}
body{
  color:var(--text);font-family:var(--font-sans);font-size:15px;min-height:100vh;
  padding-bottom:100px;-webkit-font-smoothing:antialiased;position:relative;
}

/* mesh de fondo estático — igual que gym-tracker, sin recolor por pestaña */
body::before{
  content:"";position:fixed;inset:-4%;
  background:
    radial-gradient(ellipse 100% 60% at 80% -10%, rgba(41,121,255,0.18) 0%, transparent 50%),
    radial-gradient(ellipse 80% 50% at 0% 100%, rgba(182,255,46,0.09) 0%, transparent 55%),
    radial-gradient(ellipse 60% 40% at 60% 110%, rgba(255,107,0,0.10) 0%, transparent 60%);
  pointer-events:none;z-index:0;
  animation:meshDrift 54s ease-in-out infinite alternate;will-change:transform;
}
@keyframes meshDrift{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-1.5%,1%,0) scale(1.035)}100%{transform:translate3d(1%,-1.2%,0) scale(1.015)}}
body::after{content:"";position:fixed;inset:0;background-image:radial-gradient(rgba(255,255,255,0.018) 1px, transparent 1px);background-size:3px 3px;pointer-events:none;z-index:0;opacity:0.4;}

.screen,.app-header,.bottom-nav,.toast{position:relative;z-index:1;}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;}}

/* —— CABECERA — fija de verdad, nunca se arrastra con el scroll —— */
.header{
  position:fixed;top:0;left:0;right:0;z-index:50;
  background:var(--bg);
  border-bottom:1px solid var(--border);
  padding:calc(env(safe-area-inset-top,0px) + 10px) 20px 14px;
  display:flex;align-items:center;justify-content:space-between;
}
.header h1{font-size:12.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--text);
  display:flex;align-items:center;gap:10px;}
.header .cnp-badge{color:var(--blue);font-family:var(--font-sans);font-weight:800;letter-spacing:1.6px;
  border:1px solid var(--border-2);border-radius:var(--r-xs);padding:2px 6px;font-size:10.5px;line-height:1.4;flex-shrink:0;}
.header h1 .accent{font-family:var(--font-mono);font-weight:500;letter-spacing:0px;text-transform:none;color:var(--blue);}

.wrap{position:relative;z-index:1;max-width:460px;margin:0 auto;
  padding-top:calc(env(safe-area-inset-top,0px) + 58px);}
.screen{display:none;padding:14px 16px 8px;}
.screen.active{display:flex;flex-direction:column;gap:14px;animation:pageIn 0.36s var(--ease-out-soft) both;}
@keyframes pageIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}

h2.sec{font-size:16px;font-weight:700;color:var(--text);}
.label{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:0.6px;font-weight:600;}

/* —— tarjeta compartida (recipe del gym-tracker: glass + sheen en capas) —— */
.glass,.fisico-block,.chart-wrap,.bars,.profile-card,.sett-group,.hist-session,.emom-card{
  position:relative;border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--shadow-card);
  background:linear-gradient(160deg, rgba(255,255,255,0.055) 0%, rgba(255,255,255,0.018) 60%, rgba(255,255,255,0.03) 100%);
  backdrop-filter:blur(36px) saturate(220%) brightness(1.05);
  -webkit-backdrop-filter:blur(36px) saturate(220%) brightness(1.05);
}
.glass::after,.fisico-block::after,.profile-card::after,.sett-group::after,.hist-session::after{
  content:"";position:absolute;top:0;left:8%;right:8%;height:1px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
  border-radius:1px;pointer-events:none;
}

.tap{cursor:pointer;transition:transform 0.16s var(--ease-pop);}
.tap:active{transform:scale(.97);}

button{font-family:inherit;}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;background:transparent;border:0;color:var(--text-3);cursor:pointer;padding:4px;}
.icon-btn svg{width:18px;height:18px;display:block;}

/* —— BOTÓN PRINCIPAL (save-btn) —— */
.cta,.save-btn{
  width:100%;display:block;text-align:center;background:#fff;color:#000;border:none;
  border-radius:var(--r);padding:16px;font-family:var(--font-disp);font-size:18px;font-weight:400;
  letter-spacing:1px;cursor:pointer;box-shadow:0 12px 28px rgba(255,255,255,0.08);
  transition:transform 0.18s,box-shadow 0.18s;text-transform:uppercase;
}
.cta:active,.save-btn:active{transform:scale(0.985);box-shadow:0 6px 14px rgba(255,255,255,0.06);}
.btn-ghost{background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text-2);
  border-radius:var(--r-sm);padding:10px 14px;font-size:12.5px;font-weight:600;cursor:pointer;}

/* —— HOY: today-hero (ported) —— */
.today-hero{
  position:relative;border-radius:var(--r-lg);
  background:linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.025));
  border:1px solid var(--border-2);backdrop-filter:var(--glass-strong);-webkit-backdrop-filter:var(--glass-strong);
  padding:22px;overflow:hidden;box-shadow:var(--shadow-card-lg);
}
.today-hero::before{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;
  background:linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.08) 50%, transparent 100%);
  transform:translateX(-100%);animation:shine 2.4s ease-out 0.4s both;pointer-events:none;}
@keyframes shine{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
.today-bg-text{position:absolute;font-family:var(--font-disp);font-size:54px;font-weight:400;
  color:rgba(255,255,255,0.05);text-transform:uppercase;letter-spacing:-0.5px;line-height:0.85;
  white-space:nowrap;top:14px;right:-8px;pointer-events:none;user-select:none;}
.today-top-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;position:relative;}
.today-title{font-family:var(--font-disp);font-size:40px;font-weight:400;letter-spacing:0;line-height:1;
  color:var(--text);text-transform:uppercase;position:relative;}
.today-sub{font-size:12px;color:var(--text-2);display:flex;gap:14px;margin-top:6px;position:relative;}
.notacion{font-family:var(--font-mono);font-weight:500;font-size:14px;color:var(--text-2);
  cursor:pointer;display:inline-flex;align-items:center;gap:8px;}
.notacion svg{width:14px;height:14px;color:var(--text-3);flex:none;}
.today-date-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;position:relative;}
.date-btn-wrap{position:relative;display:inline-flex;flex-shrink:0;}
.pitidos-row{margin-top:14px;position:relative;}
.pitidos-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.08);
  border:1px solid var(--border);border-radius:var(--r-pill);padding:6px 12px;
  font-size:12px;font-weight:600;color:var(--text-2);}
.pitidos-btn svg{width:14px;height:14px;}
.pitidos-line{margin-top:8px;font-size:12px;color:var(--text-3);font-family:var(--font-mono);}

/* —— SESSION INFO (pastilla de fecha, ported) —— */
.session-info{position:relative;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.date-input-label{position:relative;display:inline-flex;align-items:center;justify-content:center;
  padding:6px 12px;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:var(--r-xs);
  font-size:11px;font-weight:700;letter-spacing:0.3px;color:var(--text);white-space:nowrap;text-transform:uppercase;
  pointer-events:none;}
.date-input.date-input-hidden{position:absolute;inset:0;width:100%;height:100%;opacity:0;padding:0;border:none;
  font-size:inherit;cursor:pointer;color-scheme:dark;}

/* —— DAY GRID (ported: LUN/MIÉ/VIE) —— */
.day-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px;}
.day-btn{background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--text-2);
  padding:14px 2px;border-radius:var(--r-sm);font-family:var(--font-disp);font-size:19px;font-weight:400;
  letter-spacing:0.5px;cursor:pointer;text-align:center;position:relative;overflow:hidden;
  transition:background 0.22s ease,border-color 0.22s ease,color 0.22s ease,transform 0.18s var(--ease-pop);}
.day-btn:active{transform:scale(0.95);}
.day-btn.selected{background:#fff;border-color:#fff;color:#000;font-weight:400;
  box-shadow:0 6px 18px rgba(255,255,255,0.14), inset 0 0 0 1px rgba(255,255,255,0.4);}
.day-btn.today::after{content:"";position:absolute;left:50%;bottom:5px;width:4px;height:4px;
  border-radius:50%;background:var(--blue);transform:translateX(-50%);}
.day-btn.today.selected::after{background:#000;}

/* —— ACCESO (vol-info-btn, ported) —— */
.vol-info-btn{display:flex;align-items:center;gap:9px;width:100%;margin-bottom:0;
  background:linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.018));
  border:1px solid var(--border);border-radius:var(--r-sm);padding:11px 14px;
  color:var(--text-2);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;text-align:left;}
.vol-info-btn svg:first-child{color:var(--blue);flex-shrink:0;}
.vol-info-btn span{flex:1;}
.vol-info-btn .chev{color:var(--text-3);flex-shrink:0;}

/* —— TARJETA DE REGISTRO RÁPIDO (emom-card, ported) —— */
.emom-hdr{display:flex;align-items:center;padding:11px 14px;background:rgba(255,214,10,0.06);
  border-bottom:1px solid rgba(255,214,10,0.15);gap:10px;}
.emom-badge{background:rgba(255,214,10,0.18);color:var(--amber);border:1px solid rgba(255,214,10,0.4);
  border-radius:6px;font-size:10px;font-weight:800;padding:3px 9px;letter-spacing:1px;}
.emom-body{padding:14px;}
.emom-action{width:100%;background:linear-gradient(135deg, var(--amber), var(--orange));color:#111;border:none;
  border-radius:var(--r-sm);padding:12px;font-family:var(--font-disp);font-size:15px;font-weight:400;
  letter-spacing:1px;cursor:pointer;margin-top:12px;text-transform:uppercase;
  box-shadow:0 8px 20px rgba(255,107,0,0.3);transition:transform 0.18s;}
.emom-action:active{transform:scale(0.985);}
.sign-btn{background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:var(--r-sm);
  font-family:var(--font-disp);font-size:26px;font-weight:400;width:48px;height:48px;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;line-height:1;color:var(--text);}
.sign-btn.pos{color:var(--green);border-color:rgba(182,255,46,0.3);background:rgba(182,255,46,0.08);}
.sign-btn.neg{color:var(--red);border-color:rgba(255,69,58,0.3);background:rgba(255,69,58,0.08);}
.f-row{display:flex;align-items:center;gap:9px;margin-bottom:9px;}
.quick-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.quick-chips span{font-size:12.5px;font-family:var(--font-mono);color:var(--text-2);
  background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:100px;padding:4px 10px;}
.quick-chips button{background:none;border:none;color:var(--text-3);font-size:13px;cursor:pointer;padding:0 0 0 4px;}
.quick-editar{display:block;margin-top:10px;text-align:center;font-size:11.5px;color:var(--text-3);
  background:none;border:none;cursor:pointer;font-family:inherit;text-decoration:underline;}

/* —— SEMANA-CARD (resumen, ported) —— */
.semana-card{background:rgba(255,255,255,0.025);border:1px solid var(--border);border-radius:var(--r-sm);
  overflow:hidden;margin-top:10px;}
.semana-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:13px;}
.semana-lbl{color:var(--text-3);}
.semana-val{font-family:var(--font-mono);font-weight:600;color:var(--text);}

/* —— PERFIL FÍSICO (profile-card, ported) —— */
.profile-card{overflow:hidden;}
.profile-ghost{position:absolute;top:-10px;right:-8px;font-family:var(--font-disp);font-size:70px;font-weight:400;
  color:rgba(255,255,255,0.05);letter-spacing:-1px;line-height:0.8;text-transform:uppercase;white-space:nowrap;
  pointer-events:none;user-select:none;animation:ghostDrift 9s ease-in-out infinite;}
@keyframes ghostDrift{0%,100%{opacity:0.045;transform:translateX(0)}50%{opacity:0.08;transform:translateX(-7px)}}
.profile-top{display:flex;align-items:center;gap:12px;position:relative;padding:15px 16px 0;}
.profile-av{position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;
  background:linear-gradient(140deg, #fff, #cfe0ff 70%, #a9c6ff);
  box-shadow:inset 0 1px 2px rgba(255,255,255,0.9), inset 0 -2px 4px rgba(41,121,255,0.25), 0 4px 16px rgba(41,121,255,0.22);}
.profile-av span{font-family:var(--font-disp);font-size:21px;color:#0a1224;position:relative;z-index:2;}
.profile-id{flex:1;min-width:0;}
.profile-name{font-family:var(--font-disp);font-size:18px;font-weight:400;letter-spacing:0.2px;color:var(--text);line-height:1.05;}
.profile-chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
.pchip{font-family:var(--font-mono);font-size:10.5px;font-weight:500;color:var(--text-2);padding:3px 9px;
  background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:100px;letter-spacing:0.2px;}
.profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin:12px 16px 15px;position:relative;
  background:var(--border);border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;}
.pstat{background:var(--bg-card);padding:10px 8px 9px;text-align:center;position:relative;}
.pstat::before{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;border-radius:2px;
  background:var(--text-3);opacity:0.3;}
.pstat.fcmax::before{background:var(--red);opacity:0.6;box-shadow:0 0 10px var(--red);}
.pstat.fcreposo::before{background:var(--blue);opacity:0.6;box-shadow:0 0 10px var(--blue);}
.pstat.peso::before{background:var(--green);opacity:0.6;box-shadow:0 0 10px var(--green);}
.pstat-v{font-family:var(--font-disp);font-size:25px;font-weight:400;letter-spacing:-0.5px;line-height:1;color:var(--text);}
.pstat.fcmax .pstat-v{color:#ff6b6b;}
.pstat.fcreposo .pstat-v{color:var(--blue2);}
.pstat.peso .pstat-v{color:#c8ff5e;}
.pstat-v small{font-size:12px;font-family:var(--font-mono);color:var(--text-3);margin-left:2px;letter-spacing:0;}
.pstat-l{font-size:9.5px;color:var(--text-3);margin-top:6px;text-transform:uppercase;letter-spacing:0.6px;font-weight:700;}

/* —— ZONAS (etapa-badge, ported) —— */
.etapa-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:var(--r-pill);
  font-size:11px;font-weight:800;letter-spacing:0.9px;font-family:inherit;}
.etapa-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
.etapa-badge.z1{background:rgba(255,255,255,0.06);color:var(--text-2);border:1px solid var(--border-2);}
.etapa-badge.z2{background:var(--green-bg);color:var(--green);border:1px solid rgba(182,255,46,0.3);}
.etapa-badge.z3{background:var(--amber-bg);color:var(--amber);border:1px solid rgba(255,214,10,0.3);}
.etapa-badge.z4{background:var(--orange-bg);color:var(--orange);border:1px solid rgba(255,107,0,0.3);}
.etapa-badge.z5{background:var(--red-bg);color:var(--red);border:1px solid rgba(255,69,58,0.3);}
.zona-row2{padding:12px 16px;display:flex;align-items:baseline;gap:12px;}
.zona-row2+.zona-row2{border-top:1px solid var(--border);}
.zona-row2 .zr-name{font-size:13px;font-weight:600;color:var(--text);}
.zona-row2 .zr-use{font-size:11.5px;color:var(--text-3);margin-top:2px;}
.zona-row2 .zr-rango{margin-left:auto;font-size:12px;color:var(--text-3);font-family:var(--font-mono);flex-shrink:0;}

/* —— MACROS-STYLE detail card (ported) —— */
.macros-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.macro-item{background:rgba(255,255,255,0.035);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:14px 8px;text-align:center;}
.macro-val{font-family:var(--font-disp);font-size:28px;color:var(--text);line-height:1;}
.macro-unit{font-size:10px;color:var(--text-3);font-family:var(--font-mono);margin-top:2px;}
.macro-lbl{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:0.5px;margin-top:6px;font-weight:700;}

.hoy-tipo-sm{font-family:var(--font-disp);font-size:28px;letter-spacing:0.4px;text-transform:uppercase;color:var(--text);margin-top:4px;}

.ultima-vez{padding:14px 16px;}
.ultima-vez .tiempos{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;}
.ultima-vez .tiempos span{font-size:12.5px;font-family:var(--font-mono);color:var(--text-2);
  background:rgba(255,255,255,0.05);border-radius:6px;padding:3px 8px;}
.ultima-vez .caida{margin-top:8px;font-size:12.5px;color:var(--text-3);font-family:var(--font-mono);}
.ultima-vez .caida b{color:var(--text);}

.proximo-box{padding:14px 16px;}
.proximo-dia{font-size:14px;font-weight:700;color:var(--text);margin-top:7px;}
.proximo-notacion{margin-top:4px;font-size:12.5px;color:var(--text-2);font-family:var(--font-mono);}

.agenda-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;
  padding:13px 16px;background:transparent;border:0;cursor:pointer;color:var(--text);}
.agenda-toggle span{font-size:10px;font-weight:700;letter-spacing:0.7px;text-transform:uppercase;color:var(--text-2);}
.agenda-toggle svg{width:16px;height:16px;color:var(--text-3);transition:transform 0.25s var(--ease-out-soft);}
.agenda-toggle.open svg{transform:rotate(180deg);}
.agenda-body{display:none;padding:0 16px 14px;}
.agenda-body.open{display:block;}
.agenda-week{padding:10px 0;border-top:1px solid var(--border);}
.agenda-week:first-child{border-top:none;}
.agenda-week-lbl{font-size:10px;color:var(--text-3);letter-spacing:0.5px;text-transform:uppercase;margin-bottom:6px;font-family:var(--font-mono);}
.agenda-day{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:13px;}
.agenda-day .dot{width:7px;height:7px;border-radius:50%;flex:none;}
.agenda-day .t{flex:1;min-width:0;color:var(--text-2);}
.agenda-day .st{font-size:11px;color:var(--text-3);font-weight:600;flex:none;font-family:var(--font-mono);}
.agenda-day.today .t{color:var(--text);font-weight:700;}

.descanso-card{padding:16px;}

/* —— SEGMENTED CONTROL / PILLS (ported) —— */
.metric-row{display:flex;gap:6px;margin-bottom:0;}
.metric-btn{flex:1;background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--text-2);
  padding:10px;border-radius:var(--r-sm);font-size:12.5px;cursor:pointer;text-align:center;font-weight:600;font-family:inherit;}
.metric-btn.active{background:#fff;border-color:#fff;color:#000;}

.hist-tabs{display:flex;gap:6px;margin-bottom:0;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.hist-tabs::-webkit-scrollbar{display:none;}
.hist-tab{background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--text-2);
  padding:8px 16px;border-radius:var(--r-pill);font-family:var(--font-disp);font-size:14px;letter-spacing:0.6px;
  cursor:pointer;white-space:nowrap;flex-shrink:0;text-transform:uppercase;}
.hist-tab.active{background:#fff;border-color:#fff;color:#000;font-weight:400;}

/* —— HISTORIAL rows (conservado de estudio: punto + chevron) —— */
.hist-row{display:flex;align-items:center;gap:12px;padding:13px 15px;}
.hist-row+.hist-row{border-top:1px solid var(--border);}
.hist-dot{width:8px;height:8px;border-radius:50%;flex:none;}
.hist-main{flex:1;min-width:0;}
.hist-title{font-size:13.5px;font-weight:700;color:var(--text);}
.hist-sub{font-size:12px;color:var(--text-3);margin-top:2px;font-family:var(--font-mono);}
.hist-ch{color:var(--text-3);flex:none;font-size:18px;}

/* —— sesiones colapsables (planificación) — patrón hist-session/hist-hdr/hist-body —— */
.hist-session{margin-bottom:10px;}
.hist-hdr{padding:13px 15px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.hist-date{font-size:15px;font-weight:700;color:var(--text);letter-spacing:0.2px;}
.hist-meta{display:flex;gap:6px;align-items:center;margin-top:4px;flex-wrap:wrap;}
.hist-chip{font-size:11px;color:var(--text-2);background:rgba(255,255,255,0.05);border-radius:6px;padding:2px 8px;font-family:var(--font-mono);letter-spacing:0.2px;}
.hist-body{padding:10px 15px 12px;display:none;border-top:1px solid var(--border);}
.hist-body.open{display:block;}
.hist-controls{display:flex;align-items:center;gap:6px;}
.toggle-btn{background:none;border:none;color:var(--text-3);font-size:22px;cursor:pointer;padding:0 4px;line-height:1;}

/* —— plan: bloques de día dentro de una semana —— */
.plan-day{margin-top:14px;}
.plan-day:first-of-type{margin-top:0;}
.plan-day-title{font-family:var(--font-disp);font-size:16px;letter-spacing:0.5px;text-transform:uppercase;color:var(--text);margin-bottom:8px;}
.pf-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.pf-cell{display:flex;flex-direction:column;gap:4px;min-width:0;}
.pf-lbl{font-size:9px;color:var(--text-3);text-transform:uppercase;letter-spacing:0.3px;font-weight:700;text-align:center;}
.pf-cell .f-input{font-size:13px;padding:8px 2px;text-align:center;min-width:0;width:100%;}
.plan-notacion{margin-top:7px;font-size:12px;color:var(--text-3);font-family:var(--font-mono);}
.plan-del-link{background:none;border:0;color:var(--red);font-size:11px;font-weight:700;letter-spacing:0.3px;
  text-transform:uppercase;cursor:pointer;padding:4px;}
.plan-save-row{display:flex;gap:8px;align-items:center;}
.plan-save-row .btn-ghost{padding:10px 16px;font-size:12.5px;}

/* —— PR / stats (reuso de stats-row/stat-pill) —— */
.stats-row,.pr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.stat-pill,.pr-item{padding:14px 8px;text-align:center;}
.stat-val,.pr-val{font-family:var(--font-disp);font-size:24px;color:var(--text);line-height:1;transition:text-shadow 0.3s ease;}
.pr-val.flash{text-shadow:0 0 18px var(--amber),0 0 6px var(--amber);}
.stat-lbl,.pr-lbl{font-size:10px;color:var(--text-3);margin-top:4px;text-transform:uppercase;letter-spacing:0.5px;font-weight:600;}
.pr-date{font-size:9.5px;color:var(--text-3);margin-top:2px;font-family:var(--font-mono);}

/* —— CHART cards —— */
.chart-wrap{padding:16px;}
.chart-lbl{font-size:10px;color:var(--text-3);margin-bottom:12px;text-transform:uppercase;letter-spacing:0.7px;font-weight:700;}
.chart-sub{font-size:10px;color:var(--text-3);font-family:var(--font-mono);}
.few-points{display:flex;align-items:center;gap:14px;padding:6px 0;flex-wrap:wrap;}
.fp-item{text-align:center;}
.fp-item b{display:block;font-family:var(--font-disp);font-size:26px;color:var(--text);}
.fp-item span{display:block;font-size:10.5px;color:var(--text-3);margin-top:3px;font-family:var(--font-mono);}
.fp-arrow{color:var(--text-3);font-size:16px;}
.fp-delta{margin-left:auto;font-family:var(--font-disp);font-size:16px;padding:5px 10px;border-radius:var(--r-pill);}
.fp-delta.good{color:var(--green);background:var(--green-bg);}
.fp-delta.bad{color:var(--red);background:var(--red-bg);}
.chart-note{margin-top:8px;font-size:11.5px;color:var(--text-3);font-family:var(--font-mono);}
.chart-note.warn{color:var(--orange);}
.chart-legend{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap;}
.chart-legend span{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text-3);font-weight:600;text-transform:uppercase;font-family:var(--font-mono);}
.chart-legend i{width:8px;height:8px;border-radius:50%;display:inline-block;}

.bars{padding:16px;}
.bars-grid{display:flex;align-items:flex-end;gap:7px;height:110px;}
.bar{flex:1;border-radius:6px 6px 2px 2px;position:relative;min-height:3px;transform-origin:bottom;animation:grow 0.5s var(--ease-out-soft) backwards;}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.bar b{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:9.5px;font-weight:700;font-family:var(--font-mono);color:var(--text-2);}
.bars-axis{display:flex;gap:7px;margin-top:8px;}
.bars-axis span{flex:1;text-align:center;font-size:9.5px;color:var(--text-3);font-family:var(--font-mono);}

.resumen-grid{display:grid;grid-template-columns:repeat(3,1fr);}
.resumen-item{padding:14px 6px;text-align:center;}
.resumen-item+.resumen-item{border-left:1px solid var(--border);}
.resumen-val{font-family:var(--font-disp);font-size:22px;color:var(--text);}
.resumen-delta{font-size:10.5px;margin-top:3px;font-weight:700;font-family:var(--font-mono);}
.resumen-delta.good{color:var(--green);}
.resumen-delta.bad{color:var(--red);}
.resumen-delta.neutral{color:var(--text-3);}
.resumen-lbl{font-size:9.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:0.5px;margin-top:6px;font-weight:600;}

/* —— FÍSICO (conservado de estudio: cómo reparte el contenido) —— */
.fisico-block{padding:16px;}
.fisico-block .fh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
.fisico-block .ft{font-size:13px;font-weight:700;color:var(--text);}
.fisico-current{font-family:var(--font-disp);font-size:30px;color:var(--text);}
.fisico-current small{font-size:0.4em;color:var(--text-3);margin-left:4px;font-weight:600;font-family:var(--font-sans);}
.fisico-hist{margin-top:10px;display:flex;flex-direction:column;gap:5px;}
.fisico-hist-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-3);padding:4px 0;border-top:1px solid var(--border);font-family:var(--font-mono);}
.fisico-hist-row:first-child{border-top:none;}
.fisico-hist-row b{color:var(--text-2);}
.fisico-add{display:flex;gap:7px;margin-top:10px;}
.fisico-add input{flex:1;min-width:0;}


/* —— sec-hdr (ported: cabecera de tarjeta con icono cuadrado) —— */
.sec-hdr{display:flex;align-items:center;gap:12px;padding:16px 16px 12px;}
.sec-icon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;background:rgba(255,255,255,0.04);border:1px solid var(--border);}
.sec-title{font-size:16px;font-weight:700;color:var(--text);}
.sec-sub{font-size:12px;color:var(--text-3);margin-top:2px;font-family:var(--font-mono);}
.sec-body{padding:0 16px 16px;}

/* —— SETTINGS (ported) —— */
.sett-group{margin-bottom:12px;overflow:hidden;}
.sett-group-title{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:0.7px;padding:14px 16px 6px;font-weight:800;}
.sett-row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--border);cursor:pointer;transition:background 0.15s;}
.sett-row:first-of-type{border-top:none;}
.sett-row:active{background:rgba(255,255,255,0.04);}
.sett-icon{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:rgba(255,255,255,0.04);border:1px solid var(--border);}
.sett-row span{font-size:14px;font-weight:600;color:var(--text);}
.sett-row.danger span{color:var(--red);}

/* —— INPUTS (ported: ex-input/f-input) —— */
.campo,.f-input,select.campo,textarea.campo{
  background:var(--bg-input);border:1px solid var(--border);border-radius:var(--r-xs);
  color:var(--text);font-size:14px;padding:9px 11px;width:100%;outline:none;
  -webkit-appearance:none;font-family:var(--font-mono);transition:border-color 0.18s,background 0.18s;
}
.campo:focus,.f-input:focus,select.campo:focus,textarea.campo:focus{border-color:var(--border-3);background:rgba(255,255,255,0.09);}
.campo::placeholder,.f-input::placeholder{color:var(--text-3);font-family:var(--font-sans);}
textarea.campo{resize:vertical;min-height:60px;line-height:1.4;font-family:var(--font-sans);}
.field-lbl{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:0.5px;font-weight:700;margin-bottom:5px;display:block;}
.f-btn{background:#fff;color:#000;border:none;border-radius:var(--r-sm);padding:11px 16px;
  font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0;font-family:inherit;
  box-shadow:0 6px 14px rgba(255,255,255,0.10);transition:transform 0.15s;}
.f-btn:active{transform:scale(0.97);}
.field{margin-bottom:11px;}
.field-row{display:flex;gap:9px;}
.field-row .field{flex:1;}
.ritmo-field{display:flex;align-items:center;gap:8px;}
.ritmo-field .campo{flex:1;}
.swap-btn{flex:none;width:38px;height:38px;border-radius:var(--r-sm);background:rgba(255,255,255,0.06);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-2);}
.swap-btn svg{width:17px;height:17px;}
.tiempos-grid{display:flex;flex-wrap:wrap;gap:7px;}
.tiempos-grid .campo{width:62px;flex:none;text-align:center;padding:10px 4px;}
.toggle-row{display:flex;gap:7px;}
.toggle-row button{flex:1;padding:10px;border-radius:var(--r-sm);font-size:13px;font-weight:600;
  background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--text-2);cursor:pointer;}
.toggle-row button[aria-pressed="true"]{background:#fff;color:#000;border-color:#fff;}
.sub-field{margin-top:8px;}

/* —— BOTTOM SHEET (modal-shroud/modal-sheet, ported) —— */
.modal-shroud{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);align-items:flex-end;opacity:0;transition:opacity 0.3s ease;}
.modal-shroud.open{display:flex;opacity:1;}
.modal-sheet{width:100%;background:linear-gradient(165deg, rgba(30,30,37,0.82), rgba(14,14,18,0.92));
  backdrop-filter:var(--glass-strong);-webkit-backdrop-filter:var(--glass-strong);
  border:1px solid var(--border-2);border-bottom:none;border-radius:var(--r-lg) var(--r-lg) 0 0;
  padding:22px 20px 40px;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-card-lg);
  transform:translateY(100%);transition:transform 0.4s var(--ease-drawer);}
.modal-shroud.open .modal-sheet{transform:translateY(0);}
.modal-grab{width:38px;height:5px;background:rgba(255,255,255,0.18);border-radius:3px;margin:0 auto 18px;}
.sheet-title{font-family:var(--font-disp);font-size:22px;font-weight:400;letter-spacing:0.4px;text-transform:uppercase;margin-bottom:14px;color:var(--text);}
.sheet-actions{display:flex;gap:8px;margin-top:14px;}
.sheet-actions button{flex:1;padding:13px;border-radius:var(--r-sm);font-weight:700;font-size:13.5px;border:none;cursor:pointer;font-family:inherit;transition:transform 0.16s var(--ease-pop);}
.sheet-actions button:active{transform:scale(0.97);}
.sheet-actions .primary{background:#fff;color:#000;box-shadow:0 6px 14px rgba(255,255,255,0.10);}
.sheet-actions .secondary{background:none;border:1px solid var(--border-2);color:var(--text-2);}
.detail-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;font-size:13.5px;border-top:1px solid var(--border);}
.detail-row:first-child{border-top:none;}
.detail-row .k{color:var(--text-3);}
.detail-row .v{color:var(--text);font-weight:500;font-family:var(--font-mono);font-size:12.5px;text-align:right;}

/* —— TOAST (ported) —— */
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%) translateY(14px);
  background:rgba(20,20,26,0.94);backdrop-filter:var(--glass-strong);-webkit-backdrop-filter:var(--glass-strong);
  border:1px solid var(--border-2);color:var(--text);padding:11px 22px;border-radius:var(--r-pill);
  font-size:13.5px;font-weight:600;opacity:0;transition:opacity 0.32s var(--ease-out-soft),transform 0.32s var(--ease-out-soft);
  z-index:999;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow-card-lg);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* —— BOTTOM NAV (ported) —— */
.bottom-nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:420px;
  background:rgba(14,14,18,0.6);backdrop-filter:blur(40px) saturate(200%);-webkit-backdrop-filter:blur(40px) saturate(200%);
  border:1px solid var(--border-2);border-radius:var(--r-pill);display:flex;padding:6px;gap:2px;box-shadow:var(--shadow-nav);z-index:100;}
.nav-btn{flex:1;background:none;border:none;color:var(--text-3);padding:9px 4px 7px;font-size:9.5px;font-family:inherit;
  font-weight:600;letter-spacing:0.4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;
  border-radius:var(--r-pill);position:relative;z-index:1;transition:color 0.2s;}
.nav-btn.active{color:#fff;}
.nav-indicator{position:absolute;top:6px;bottom:6px;left:0;border-radius:var(--r-pill);
  background:linear-gradient(160deg, rgba(255,255,255,0.14), rgba(255,255,255,0.05));
  border:1px solid rgba(255,255,255,0.2);
  box-shadow:0 2px 12px rgba(0,0,0,0.3), 0 0 16px -6px rgba(182,255,46,0.16), inset 0 1px 0 rgba(255,255,255,0.16);
  transition:transform 0.5s var(--ease-spring), width 0.5s var(--ease-spring);will-change:transform;pointer-events:none;z-index:0;}
.nav-icon svg{display:block;}

.empty{padding:28px 16px;text-align:center;color:var(--text-3);font-size:13px;font-family:var(--font-mono);}
.empty-mini{padding:2px 0 4px;font-size:12.5px;color:var(--text-3);line-height:1.4;font-family:var(--font-mono);}
</style>
</head>

</div>

<div class="wrap">

  <section id="screen-historial" class="screen">

      <div id="app-version" style="margin-top:5px;font-size:9.5px;opacity:0.6;"></div>
    </div>
  </section>

</div>

<nav class="bottom-nav">
  <span class="nav-indicator" id="nav-indicator" aria-hidden="true"></span>
  <button class="nav-btn active" data-tab="hoy">
    <span class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.2V12l3.2 2"/></svg></span>Hoy
  </button>
  <button class="nav-btn" data-tab="historial">
    <span class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg></span>Sesiones
  </button>
  <button class="nav-btn" data-tab="progreso">
    <span class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><polyline points="4 18 9 13 13 16 20 7"/></svg></span>Progreso
  </button>
  <button class="nav-btn" data-tab="fisico">
    <span class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="7" r="3"/><path d="M5 21v-2a7 7 0 0114 0v2"/></svg></span>Físico

<script>
'use strict';
/* ============================================================
   UTILIDADES
   ============================================================ */
const pad2 = n => String(Math.round(n)).padStart(2,'0');

function parseFlexTime(str){
  if(str==null) return null;
  str = String(str).trim();
  if(str==='') return null;
  if(str.includes(':')){
    const [m,s] = str.split(':').map(Number);
    if(isNaN(m)||isNaN(s)) return null;
    return m*60+s;
  }
  const n = Number(str.replace(',','.'));
  return isNaN(n) ? null : n;
}
function secToPace(sec){ if(sec==null||isNaN(sec)) return '—'; sec=Math.round(sec); const m=Math.floor(sec/60), s=sec%60; return `${m}:${pad2(s)}`; }
function secToTime(sec){ if(sec==null||isNaN(sec)) return '—'; sec=Math.round(sec); if(sec<60) return `${sec} s`; const m=Math.floor(sec/60), s=sec%60; return `${m}:${pad2(s)}`; }
function ritmoFromRep(repSec, distM){ return repSec*1000/distM; }
function repFromRitmo(ritmoSec, distM){ return ritmoSec*distM/1000; }
function fmtRec(tipo, sec){
  if(sec==null||isNaN(sec)) return '—';
  sec = Math.round(sec);
  if(tipo==='velocidad') return `${sec}"`;
  if(sec%60===0) return `${sec/60}'`;
  const m=Math.floor(sec/60), s=sec%60; return `${m}:${pad2(s)}`;
}
function parseISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function pad2s(n){ return String(n).padStart(2,'0'); }
function toISO(d){ return `${d.getFullYear()}-${pad2s(d.getMonth()+1)}-${pad2s(d.getDate())}`; }
function todayISO(){ return toISO(new Date()); }
function addDays(dateStr, n){ const d=parseISO(dateStr); d.setDate(d.getDate()+n); return toISO(d); }
const DIAS=['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];
const DIAS_FULL=['DOMINGO','LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO'];
const MESES=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
const MESES_MIN=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fmtDateLong(s){ const d=parseISO(s); return `${DIAS[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]}`; }
function fmtDateShort(s){ const d=parseISO(s); return `${d.getDate()} ${MESES_MIN[d.getMonth()]}`; }
function fmtDatePill(s){ const d=parseISO(s); return `${DIAS_FULL[d.getDay()]} · ${d.getDate()} ${MESES[d.getMonth()]} ${d.getFullYear()}`; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

/* ============================================================
   DATOS
   ============================================================ */
const OLD_KEYS = ['m1000_sessions','m1000_meta','m1000_agenda','m1000_last_export_ts','m1000_export_reminder_seen','m1000_cleared_at'];
OLD_KEYS.forEach(k=>localStorage.removeItem(k));

const PLAN_DEFAULT = [
  {lunes:'2026-11-02', series:{n:5,dist:400,ritmo:'3:32',rec:'2:00'}, rodaje:{dur:35,rectas:4}, velocidad:{n:8,dist:200,ritmo:'3:20',rec:'1:30'}},
  {lunes:'2026-11-09', series:{n:6,dist:400,ritmo:'3:30',rec:'2:00'}, rodaje:{dur:38,rectas:4}, velocidad:{n:8,dist:200,ritmo:'3:20',rec:'1:30'}},
  {lunes:'2026-11-16', series:{n:5,dist:400,ritmo:'3:23',rec:'2:00'}, rodaje:{dur:40,rectas:6}, velocidad:{n:10,dist:200,ritmo:'3:20',rec:'1:30'}},
  {lunes:'2026-11-23', series:{n:6,dist:400,ritmo:'3:25',rec:'1:45'}, rodaje:{dur:40,rectas:6}, velocidad:{n:8,dist:200,ritmo:'3:10',rec:'1:30'}},
  {lunes:'2026-11-30', series:{n:5,dist:400,ritmo:'3:25',rec:'2:00'}, rodaje:{dur:25,rectas:4}, velocidad:{n:8,dist:200,ritmo:'3:20',rec:'1:30'}},
];

const TESTS_DEFAULT = [
  {id:uid(), tipo:'test', fecha:'2026-09-06', tiempoTotal:229},
  {id:uid(), tipo:'test', fecha:'2026-10-05', tiempoTotal:210},
];

const FCMAX_DEFAULT = [{fecha:'2026-09-27', valor:197}];
const FCREPOSO_DEFAULT = [{fecha:'2026-09-27', valor:49}];

function loadJSON(key, fallback){
  try{ const v = localStorage.getItem(key); return v==null ? fallback : JSON.parse(v); }
  catch(e){ return fallback; }
}
function saveJSON(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

const DB = {
  sesiones: loadJSON('m1000_sesiones', TESTS_DEFAULT),
  plan: loadJSON('m1000_plan', PLAN_DEFAULT),
  fcmax: loadJSON('m1000_fcmax', FCMAX_DEFAULT),
  fcreposo: loadJSON('m1000_fcreposo', FCREPOSO_DEFAULT),
  peso: loadJSON('m1000_peso', []),
  pref: loadJSON('m1000_pref', {ritmo:'pace'}),
  ui: {agendaOpen:false},
};
function persist(){
  saveJSON('m1000_sesiones', DB.sesiones);
  saveJSON('m1000_plan', DB.plan);
  saveJSON('m1000_fcmax', DB.fcmax);
  saveJSON('m1000_fcreposo', DB.fcreposo);
  saveJSON('m1000_peso', DB.peso);
  saveJSON('m1000_pref', DB.pref);
}

const APP_VERSION = 1;
const APP_BUILD_DATE = '25 oct 2026';

const TIPOS = {
  series:{label:'Series de ritmo', color:'var(--c-series)', dot:'var(--blue)'},
  rodaje:{label:'Rodaje base', color:'var(--c-rodaje)', dot:'var(--green)'},
  velocidad:{label:'Velocidad', color:'var(--c-velocidad)', dot:'var(--orange)'},
  test:{label:'Test 1.000', color:'var(--c-test)', dot:'var(--amber)'},
};

/* ============================================================
   PLAN / SESIÓN DEL DÍA
   ============================================================ */
function isFirstFriday(d){ return d.getDay()===5 && d.getDate()<=7; }
function getWeekForDate(dateStr){
  const t = +parseISO(dateStr);
  for(const w of DB.plan){
    const mon = +parseISO(w.lunes);
    const sun = mon + 6*86400000;
    if(t>=mon && t<=sun) return w;
  }
  return null;
}
function getSessionDef(dateStr){
  const d = parseISO(dateStr);
  const dow = d.getDay();
  if(dow===5 && isFirstFriday(d)) return {tipo:'test'};
  const week = getWeekForDate(dateStr);
  if(!week) return {tipo:'descanso'};
  if(dow===1) return {tipo:'series', ...week.series};
  if(dow===3) return {tipo:'rodaje', ...week.rodaje};
  if(dow===5) return {tipo:'velocidad', ...week.velocidad};
  return {tipo:'descanso'};
}
function compactNotation(def, mode){
  mode = mode || DB.pref.ritmo;
  if(def.tipo==='series' || def.tipo==='velocidad'){
    const paceSec = parseFlexTime(def.ritmo);
    const recSec = parseFlexTime(def.rec);
    let val;
    if(mode==='pace') val = `@ ${def.ritmo}${def.tipo==='series'?'/km':''}`;
    else val = `· ${secToTime(repFromRitmo(paceSec, def.dist))}`;
    return `${def.n} × ${def.dist} ${val} r${fmtRec(def.tipo, recSec)}`;
  }
  if(def.tipo==='rodaje') return `${def.dur}' Z2 + ${def.rectas} × 100`;
  if(def.tipo==='test') return 'TEST 1.000';
  return 'Descanso';
}
function pitidoSeg(def){
  const paceSec = parseFlexTime(def.ritmo);
  return Math.round(paceSec/10);
}

/* ============================================================
   NAVEGACIÓN
   ============================================================ */
let currentTab = 'hoy';
let historialSub = 'historial';
function showTab(tab){
  currentTab = tab;
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active', s.id==='screen-'+tab));
  const btn = document.querySelector(`.nav-btn[data-tab="${tab}"]`);
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  if(btn){ btn.classList.add('active'); updateNavIndicator(btn); }
  renderCurrent();
}
document.querySelectorAll('.nav-btn').forEach(b=>{
  b.addEventListener('click', ()=>{ showTab(b.dataset.tab); if(navigator.vibrate) navigator.vibrate(10); });
});
function updateNavIndicator(btn){
  const ind = document.getElementById('nav-indicator');
  if(!ind||!btn) return;
  ind.style.width = btn.offsetWidth+'px';
  ind.style.transform = 'translateX('+btn.offsetLeft+'px)';
}
window.addEventListener('resize', ()=>{ const a=document.querySelector('.nav-btn.active'); if(a) updateNavIndicator(a); });
function renderCurrent(){
  if(currentTab==='hoy') renderHoy();
  else if(currentTab==='historial') renderHistorial();
  else if(currentTab==='progreso') renderProgreso();
  else if(currentTab==='fisico') renderFisico();
  else if(currentTab==='ajustes') renderAjustes();
}

   TOAST

let toastTimer=null;
function toast(msg){
  const el = document.getElementById('toast');

function lastSessionOfType(tipo, beforeFecha){
  return DB.sesiones
    .filter(s=>s.tipo===tipo && s.fecha < beforeFecha)
    .sort((a,b)=> a.fecha<b.fecha?1:-1)[0];
}
function renderUltimaVez(tipo, fecha){
  const prev = lastSessionOfType(tipo, fecha);
  if(!prev) return `<div class="glass ultima-vez"><div class="label">Última vez</div><div style="margin-top:6px;color:var(--text-3);font-size:13px;font-family:var(--font-mono)">Sin registros previos</div></div>`;
  let body = '';
  if(prev.tiempos && prev.tiempos.length){
    const caida = prev.tiempos[0]-prev.tiempos[prev.tiempos.length-1];
    body = `<div class="tiempos">${prev.tiempos.map(t=>`<span>${secToTime(t)}</span>`).join('')}</div>
      <div class="caida">Caída <b>${caida>=0?'+':''}${Math.round(caida)} s</b></div>`;
  } else if(prev.tipo==='rodaje'){
    body = `<div class="caida">${prev.duracion?prev.duracion+' min · ':''}${prev.ritmo130!=null?'Ritmo 130: '+secToPace(prev.ritmo130)+'/km':''}</div>`;
  } else if(prev.tipo==='test'){
    body = `<div class="caida">Tiempo <b>${secToTime(prev.tiempoTotal)}</b></div>`;
  }
  return `<div class="glass ultima-vez"><div class="label">Última vez · ${fmtDateShort(prev.fecha)}</div>${body}</div>`;
}
function weekTotalMeters(weekMonday){
  const fin = addDays(weekMonday,6);
  let m = 0;
  DB.sesiones.forEach(s=>{
    if((s.tipo==='series'||s.tipo==='velocidad') && s.fecha>=weekMonday && s.fecha<=fin){
      m += (s.series||0)*(s.distancia||0);
    }
  });
  return m;
}
function fmtMetros(m){ return m.toLocaleString('es-ES')+' m'; }
function renderDayGrid(selFecha){
  const week = getWeekForDate(selFecha);
  const today = todayISO();
  const dias = [['Lun','LUN'],['Mié','MIÉ'],['Vie','VIE']];
  const offsets = {Lun:0, Mié:2, Vie:4};
  const btns = dias.map(([key,lbl])=>{
    const d = week ? addDays(week.lunes, offsets[key]) : null;
    const cls = ['day-btn']; if(d===selFecha) cls.push('selected'); if(d===today) cls.push('today');
    return `<button class="${cls.join(' ')} tap" ${d?`onclick="selectDay('${d}')"`:'disabled'}>${lbl}</button>`;
  }).join('');
  return `<div class="day-grid">${btns}</div>`;
}
let selectedFecha = null;
function defaultSelectedFecha(){
  const t = todayISO();
  return getSessionDef(t).tipo!=='descanso' ? t : nextTrainingDate(t).fecha;
}
function selectDay(fecha){
  selectedFecha = fecha;
  renderHoy();
  if(navigator.vibrate) navigator.vibrate(10);
}
function onHoyDateChange(v){
  if(!v) return;
  selectedFecha = v;
  renderHoy();
}
let quickTiempos = [];
function quickAddTiempo(){
  const input = document.getElementById('quick-tiempo-input');
  const v = parseFlexTime(input.value);
  if(v==null) return;
  quickTiempos.push(v);
  input.value = '';
  renderQuickChips();
}
function quickRemoveTiempo(i){
  quickTiempos.splice(i,1);
  renderQuickChips();
}
function renderQuickChips(){
  const el = document.getElementById('quick-chips');
  if(!el) return;
  el.innerHTML = quickTiempos.map((t,i)=>`<span>${secToTime(t)} <button onclick="quickRemoveTiempo(${i})" aria-label="Quitar">✕</button></span>`).join('');
}
function quickGuardar(fecha, tipo){
  if(!quickTiempos.length) return;
  checkPRUpdate(tipo==='series'?400:200, Math.min(...quickTiempos));
  const existing = DB.sesiones.find(s=>s.fecha===fecha && s.tipo===tipo);
  const def = getSessionDef(fecha);
  const obj = existing ? {...existing} : {fecha, tipo, series:def.n, distancia:def.dist, ritmo:parseFlexTime(def.ritmo), recuperacion:parseFlexTime(def.rec)};
  obj.tiempos = quickTiempos.slice();
  obj.series = quickTiempos.length;
  upsertSesion(obj);
  persist();
  quickTiempos = [];
  toast('Tiempos guardados');
  renderCurrent();
}
function renderQuickCard(def, fecha){
  const meta = TIPOS[def.tipo];
  quickTiempos = [];
  return `
    <div class="emom-card">
      <div class="emom-hdr">
        <div class="sec-icon" style="background:rgba(41,121,255,0.08);border-color:rgba(41,121,255,0.22)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--blue2)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg></div>
        <div><div class="sec-title" style="font-size:15px">Tiempos</div><div class="sec-sub">${fmtDateLong(fecha)}</div></div>
      </div>
      <div class="emom-body">
        <div class="f-row">
          <input type="text" class="f-input" id="quick-tiempo-input" placeholder="${def.tipo==='series'?'1:25':'40'}" inputmode="decimal">
          <button class="sign-btn pos tap" onclick="quickAddTiempo()">+</button>
        </div>
        <div class="quick-chips" id="quick-chips"></div>

        <button class="quick-editar tap" onclick="openRegistro('${fecha}')">Editar detalles (FC, cadencia, notas)</button>
      </div>
    </div>
    <div class="semana-card">
      <div class="semana-row"><span class="semana-lbl">Total semana</span><span class="semana-val">${fmtMetros(weekTotalMeters(getWeekForDate(fecha).lunes))}</span></div>
    </div>
  `;
}
function openResumenSemana(fecha){
  openSheet(`
    <div class="sheet-title">Resumen de la semana</div>
    ${renderEstaSemanaBox(fecha).replace('class="glass"','class="glass" style="padding:0"')}
    <div class="sheet-actions"><button class="primary" onclick="closeSheet()">Cerrar</button></div>
  `);
}
function renderHoy(){
  const el = document.getElementById('screen-hoy');
  if(selectedFecha==null) selectedFecha = defaultSelectedFecha();
  const fecha = selectedFecha;
  const def = getSessionDef(fecha);
  const tipoMeta = TIPOS[def.tipo];

  if(def.tipo==='descanso'){
    const next = nextTrainingDate(fecha);
    const nextMeta = TIPOS[next.def.tipo];
    el.innerHTML = `
      <div class="today-hero">
        <div class="today-bg-text">DESCANSO</div>
        <div class="today-top-row"><div class="today-title" style="font-size:32px">Descanso</div></div>

      </div>
      <div class="glass proximo-box">
        <div class="label">Próximo entreno</div>
        <div class="proximo-dia">${fmtDateLong(next.fecha)} · ${nextMeta.label}</div>
        <div class="proximo-notacion">${compactNotation(next.def)}</div>
      </div>
      ${renderDayGrid(fecha)}
      ${renderEstaSemanaBox(fecha)}
      ${renderAgendaSection()}
    `;
    bindAgendaToggle();
    return;
  }

  const pitidos = (def.tipo==='series'||def.tipo==='velocidad') ? pitidoSeg(def) : null;
  const quickHTML = (def.tipo==='series'||def.tipo==='velocidad') ? renderQuickCard(def, fecha) : `<button class="cta tap" onclick="openRegistro('${fecha}')">Registrar</button>`;
  el.innerHTML = `
    <div class="today-hero" id="today-hero">
      <div class="today-bg-text">${tipoMeta.label.split(' ')[0]}</div>
      <div class="today-top-row"><div class="today-title">${tipoMeta.label}</div></div>
      <div class="today-sub">
        <span class="notacion" onclick="toggleRitmoView()">${compactNotation(def)}
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:12px;height:12px;vertical-align:-1px;margin-left:4px"><path d="M7 7h11M18 7l-3-3M18 7l-3 3M17 17H6M6 17l3 3M6 17l3-3"/></svg>
        </span>
      </div>
      ${pitidos!=null ? `
      <div class="pitidos-row">
        <button class="pitidos-btn" id="pitidos-btn" onclick="togglePitidos()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="8" r="0.6" fill="currentColor" stroke="none"/></svg>
          Pitidos
        </button>
        <div class="pitidos-line" id="pitidos-line" style="display:none">Pitido cada ${pitidos} s · un pitido por cada 100 m</div>
      </div>` : ''}
      <div class="today-date-row">
        <div class="date-btn-wrap">
          <input type="date" id="hoy-date-input" class="date-input date-input-hidden" value="${fecha}" onchange="onHoyDateChange(this.value)">
          <span class="date-input-label">${fmtDatePill(fecha)}</span>

    </div>
    ${renderDayGrid(fecha)}
    <button class="vol-info-btn tap" onclick="openResumenSemana('${fecha}')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="20" x2="4" y2="13"/><line x1="10" y1="20" x2="10" y2="8"/><line x1="16" y1="20" x2="16" y2="4"/><line x1="22" y1="20" x2="22" y2="11"/></svg>
      <span>Resumen de la semana</span>
      <svg class="chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    ${quickHTML}

  `;
  bindAgendaToggle();
}
function bindAgendaToggle(){
  const btn = document.getElementById('agenda-toggle-btn');
  const body = document.getElementById('agenda-body');
  if(!btn) return;
  btn.classList.toggle('open', DB.ui.agendaOpen);
  body.classList.toggle('open', DB.ui.agendaOpen);
}
function renderAgendaSection(){
  const today = todayISO();
  const weeks = DB.plan.map(w=>{
    const dLun = w.lunes, dMie = addDays(w.lunes,2), dVie = addDays(w.lunes,4);
    const defLun = getSessionDef(dLun), defMie = getSessionDef(dMie), defVie = getSessionDef(dVie);
    const rango = `${fmtDateShort(dLun)} – ${fmtDateShort(addDays(w.lunes,6))}`;
    const rows = [[dLun,defLun],[dMie,defMie],[dVie,defVie]].map(([fecha,def])=>{
      const meta = TIPOS[def.tipo] || {dot:'var(--text-3)'};
      const done = DB.sesiones.some(s=>s.fecha===fecha && s.tipo===def.tipo);
      let status;
      if(fecha===today) status='HOY';
      else if(fecha>today) status='';
      else status = done ? 'Hecho' : 'Sin registrar';
      return `<div class="agenda-day ${fecha===today?'today':''}">
        <span class="dot" style="background:${meta.dot}"></span>
        <span class="t">${compactNotation(def)}</span>
        <span class="st">${status}</span>
      </div>`;
    }).join('');
    return `<div class="agenda-week"><div class="agenda-week-lbl">${rango}</div>${rows}</div>`;
  }).join('');
  return `
    <div class="glass">
      <button class="agenda-toggle" id="agenda-toggle-btn" onclick="toggleAgenda()">
        <span>Agenda</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="agenda-body" id="agenda-body">${weeks}</div>
    </div>
  `;
}
function nextTrainingDate(fromDate){
  let d = addDays(fromDate,1);
  for(let i=0;i<14;i++){
    const def = getSessionDef(d);
    if(def.tipo!=='descanso') return {fecha:d, def};
    d = addDays(d,1);
  }
  return {fecha:d, def:{tipo:'descanso'}};
}
function renderEstaSemanaBox(fecha){
  const week = getWeekForDate(fecha);
  if(!week) return '';
  const today = fecha;
  const dias = [['Lun', week.lunes], ['Mié', addDays(week.lunes,2)], ['Vie', addDays(week.lunes,4)]];
  const rows = dias.map(([lbl,d])=>{
    const def = getSessionDef(d);
    const meta = TIPOS[def.tipo] || {dot:'var(--text-3)', label:'—'};
    const done = DB.sesiones.some(s=>s.fecha===d && s.tipo===def.tipo);
    let status;
    if(d===today) status='HOY';
    else if(d>today) status='';
    else status = done ? 'Hecho' : 'Sin registrar';
    return `<div class="agenda-day ${d===today?'today':''}">
      <span class="dot" style="background:${meta.dot}"></span>
      <span class="t">${lbl} · ${meta.label}</span>
      <span class="st">${status}</span>
    </div>`;
  }).join('');
  return `<div class="glass" style="padding:14px 16px"><div class="label">Esta semana</div><div style="margin-top:8px">${rows}</div></div>`;
}

function regSetBool(field, val, btn){
  reg[field]=val;
  btn.parentNode.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed','false'));

  if(field==='calentamiento'){
    document.getElementById('reg-calmin-wrap').style.display = val ? 'block':'none';
  }
}
function collectTiempos(n){
  const arr=[];
  for(let i=0;i<n;i++){
    const v = document.getElementById('reg-t-'+i);
    const parsed = v ? parseFlexTime(v.value) : null;
    if(parsed!=null) arr.push(parsed);
  }
  return arr;
}
function upsertSesion(obj){
  const i = DB.sesiones.findIndex(s=>s.fecha===obj.fecha && s.tipo===obj.tipo);
  if(i>=0) DB.sesiones[i] = {...DB.sesiones[i], ...obj};
  else { obj.id = uid(); DB.sesiones.push(obj); }
}
function saveRegistro(){
  const fecha = reg.fecha, tipo = reg.tipo;
  if(tipo==='series' || tipo==='velocidad'){
    const n = parseInt(document.getElementById('reg-n').value,10)||0;
    const dist = parseFloat(document.getElementById('reg-dist').value)||reg.def.dist;
    const recSec = parseFlexTime(document.getElementById('reg-rec').value);
    const tiempos = collectTiempos(n);
    const fcmax = parseFloat(document.getElementById('reg-fcmax').value)||null;
    const cadencia = parseFloat(document.getElementById('reg-cadencia').value)||null;
    const sensacion = document.getElementById('reg-sensacion').value.trim();
    const notas = document.getElementById('reg-notas').value.trim();
    checkPRUpdate(tipo==='series'?400:200, tiempos.length?Math.min(...tiempos):null);
    upsertSesion({fecha, tipo, series:n, distancia:dist, ritmo:reg.ritmoSec, recuperacion:recSec, tiempos, fcMax:fcmax, cadencia, sensacion, notas});
  } else if(tipo==='rodaje'){
    const duracion = parseFloat(document.getElementById('reg-duracion').value)||null;
    const ritmoMedio = parseFlexTime(document.getElementById('reg-ritmomedio').value);
    const ritmo130 = parseFlexTime(document.getElementById('reg-ritmo130').value);
    const fcMedia = parseFloat(document.getElementById('reg-fcmedia').value)||null;
    const fcMax = parseFloat(document.getElementById('reg-fcmax').value)||null;
    const cadencia = parseFloat(document.getElementById('reg-cadencia').value)||null;
    const rectasN = parseFloat(document.getElementById('reg-rectasn').value)||null;
    const rectasT = parseFlexTime(document.getElementById('reg-rectast').value);
    const notas = document.getElementById('reg-notas').value.trim();
    upsertSesion({fecha, tipo, duracion, ritmoMedio, ritmo130, fcMedia, fcMax, cadencia, rectas:{n:rectasN, tiempoMedio:rectasT}, notas});
  } else if(tipo==='test'){
    const tiempoTotal = parseFlexTime(document.getElementById('reg-tiempototal').value);
    const split500 = parseFlexTime(document.getElementById('reg-split500').value);
    const fcMax = parseFloat(document.getElementById('reg-fcmax').value)||null;
    const calMinEl = document.getElementById('reg-calmin');
    const calMin = calMinEl ? (parseFloat(calMinEl.value)||null) : null;
    const condiciones = document.getElementById('reg-condiciones').value.trim();
    const notas = document.getElementById('reg-notas').value.trim();
    checkPRUpdate(1000, tiempoTotal);
    upsertSesion({fecha, tipo, tiempoTotal, split500, fcMax, calentamiento:{hecho:!!reg.calentamiento, minutos:calMin}, gel:!!reg.gel, condiciones, notas});
  } else {
    closeSheet(); return;
  }
  persist();
  closeSheet();
  toast('Sesión guardada');
  renderCurrent();
}
function checkPRUpdate(distLabel, value){
  if(value==null) return;
  const prev = getPR(distLabel);
  if(prev==null || value < prev.valor){
    window.__prFlash = {dist:distLabel, ts:Date.now()};
    setTimeout(()=>toast(`Nueva marca personal: ${distLabel} m`), 350);
  }
}

function setHistorialSub(sub){
  historialSub = sub;
  document.querySelectorAll('#hist-switch .metric-btn').forEach(b=>b.classList.toggle('active', b.dataset.sub===sub));
  document.getElementById('historial-sub-historial').style.display = sub==='historial' ? 'block' : 'none';
  document.getElementById('historial-sub-planificacion').style.display = sub==='planificacion' ? 'block' : 'none';
  if(sub==='planificacion') renderPlanificacion();
  else renderHistorialList();
}
function renderHistorial(){
  document.querySelectorAll('#hist-switch .metric-btn').forEach(b=>b.classList.toggle('active', b.dataset.sub===historialSub));
  document.getElementById('historial-sub-historial').style.display = historialSub==='historial' ? 'block' : 'none';
  document.getElementById('historial-sub-planificacion').style.display = historialSub==='planificacion' ? 'block' : 'none';
  if(historialSub==='planificacion') renderPlanificacion();

}
let histFilter = 'all';
function filterHistorial(tipo){ histFilter = tipo; renderHistorialList(); }
function renderHistorialList(){
  const filterEl = document.getElementById('hist-filter');
  const filtros = [['all','Todo'],['series','Series'],['rodaje','Rodaje'],['velocidad','Velocidad'],['test','Test']];
  filterEl.innerHTML = filtros.map(([k,l])=>`<button class="hist-tab ${histFilter===k?'active':''}" onclick="filterHistorial('${k}')">${l}</button>`).join('');

  const list = DB.sesiones
    .filter(s=>histFilter==='all' || s.tipo===histFilter)
    .sort((a,b)=> a.fecha<b.fecha?1:-1);

  const listEl = document.getElementById('hist-list');
  if(!list.length){ listEl.innerHTML = `<div class="empty">Sin sesiones todavía</div>`; return; }
  listEl.innerHTML = `<div class="glass">` + list.map(s=>{
    const meta = TIPOS[s.tipo];
    let sub = '';
    if(s.tipo==='series' || s.tipo==='velocidad'){
      if(s.tiempos && s.tiempos.length){
        const media = s.tiempos.reduce((a,b)=>a+b,0)/s.tiempos.length;
        sub = `${s.series} × ${s.distancia}   media ${secToTime(media)}`;
      } else sub = `${s.series} × ${s.distancia}`;
    } else if(s.tipo==='rodaje'){
      sub = `${s.duracion||'—'} min${s.ritmoMedio!=null?'   '+secToPace(s.ritmoMedio)+'/km':''}${s.fcMedia!=null?'   '+s.fcMedia+' ppm':''}`;
    } else if(s.tipo==='test'){
      sub = secToTime(s.tiempoTotal);
    }
    return `<div class="hist-row tap" onclick="openDetail('${s.id||s.fecha+s.tipo}')">
      <span class="hist-dot" style="background:${meta.dot}"></span>
      <div class="hist-main"><div class="hist-title">${fmtDateLong(s.fecha)} · ${meta.label}</div><div class="hist-sub">${sub}</div></div>
      <span class="hist-ch">›</span>
    </div>`;
  }).join('') + `</div>`;
}
function findSesion(key){
  return DB.sesiones.find(s=>(s.id||s.fecha+s.tipo)===key);
}
function openDetail(key){
  const s = findSesion(key);
  if(!s) return;
  const meta = TIPOS[s.tipo];
  let rows = [];
  if(s.tipo==='series' || s.tipo==='velocidad'){
    rows.push(['Series', s.series]);
    rows.push(['Distancia', s.distancia+' m']);
    if(s.ritmo!=null) rows.push(['Ritmo plan', secToPace(s.ritmo)+'/km']);
    rows.push(['Recuperación', fmtRec(s.tipo, s.recuperacion)]);
    if(s.tiempos && s.tiempos.length){
      rows.push(['Tiempos', s.tiempos.map(secToTime).join(' · ')]);
      const caida = s.tiempos[0]-s.tiempos[s.tiempos.length-1];
      rows.push(['Caída', (caida>=0?'+':'')+Math.round(caida)+' s']);
      const media = s.tiempos.reduce((a,b)=>a+b,0)/s.tiempos.length;
      rows.push(['Media', secToTime(media)]);
    }
    if(s.fcMax) rows.push(['FC máxima', s.fcMax+' ppm']);
    if(s.cadencia) rows.push(['Cadencia', s.cadencia+' spm']);
    if(s.sensacion) rows.push(['Sensación', s.sensacion]);
  } else if(s.tipo==='rodaje'){
    rows.push(['Duración', (s.duracion||'—')+' min']);
    if(s.ritmoMedio!=null) rows.push(['Ritmo medio', secToPace(s.ritmoMedio)+'/km']);
    if(s.ritmo130!=null) rows.push(['Ritmo a 130 ppm', secToPace(s.ritmo130)+'/km']);
    if(s.fcMedia) rows.push(['FC media', s.fcMedia+' ppm']);
    if(s.fcMax) rows.push(['FC máxima', s.fcMax+' ppm']);
    if(s.cadencia) rows.push(['Cadencia media', s.cadencia+' spm']);
    if(s.rectas && s.rectas.n) rows.push(['Rectas', s.rectas.n+' × '+(s.rectas.tiempoMedio!=null?secToTime(s.rectas.tiempoMedio):'—')]);
  } else if(s.tipo==='test'){
    rows.push(['Tiempo total', secToTime(s.tiempoTotal)]);
    if(s.split500!=null) rows.push(['Split 500', secToTime(s.split500)]);
    if(s.fcMax) rows.push(['FC máxima', s.fcMax+' ppm']);
    if(s.calentamiento) rows.push(['Calentamiento', s.calentamiento.hecho ? (s.calentamiento.minutos||'—')+' min' : 'No']);
    if(s.gel!=null) rows.push(['Gel', s.gel?'Sí':'No']);
    if(s.condiciones) rows.push(['Condiciones', s.condiciones]);
  }
  if(s.notas) rows.push(['Notas', s.notas]);
  openSheet(`
    <div class="sheet-title" style="color:${meta.color}">${fmtDateLong(s.fecha)}</div>
    ${rows.map(([k,v])=>`<div class="detail-row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('')}
    <div class="sheet-actions">
      <button class="secondary" onclick="deleteSesion('${key}')">Eliminar</button>
      <button class="primary" onclick="closeSheet()">Cerrar</button>
    </div>
  `);
}
function deleteSesion(key){
  if(!confirm('¿Eliminar esta sesión?')) return;
  DB.sesiones = DB.sesiones.filter(s=>(s.id||s.fecha+s.tipo)!==key);
  persist();
  closeSheet();
  renderCurrent();
}

/* ============================================================
   PLANIFICACIÓN — semanas colapsables
   ============================================================ */
let planOpenIdx = undefined; // undefined = sin calcular todavía; -1 = todas plegadas; N = semana N abierta
let planDraft = null; // {idx, data} — copia editable de la semana abierta, aparte de DB.plan hasta Guardar
function getCurrentWeekIndex(){
  const today = todayISO();
  let idx = DB.plan.findIndex(w => today>=w.lunes && today<=addDays(w.lunes,6));
  if(idx>=0) return idx;
  idx = DB.plan.findIndex(w => w.lunes>=today);
  return idx>=0 ? idx : 0;
}
function planHasChanges(){
  if(!planDraft) return false;
  return JSON.stringify(planDraft.data) !== JSON.stringify(DB.plan[planDraft.idx]);
}
function confirmDiscardPlanChanges(){
  if(!planHasChanges()) return true;
  return confirm('Hay cambios sin guardar en esta semana. ¿Descartarlos?');
}
function startPlanDraft(idx){
  planDraft = {idx, data: JSON.parse(JSON.stringify(DB.plan[idx]))};
}
function togglePlanWeek(i){
  if(!confirmDiscardPlanChanges()) return;
  planDraft = null;
  planOpenIdx = (planOpenIdx===i) ? -1 : i;
  if(planOpenIdx>=0) startPlanDraft(planOpenIdx);
  renderPlanificacion();
}
function planUpdate(idx, field, sub, value){
  if(!planDraft || planDraft.idx!==idx) startPlanDraft(idx);
  if(!planDraft.data[field]) planDraft.data[field] = {};
  planDraft.data[field][sub] = value;
}
function updatePlanNotacion(idx, dayKey){
  const data = planDraft && planDraft.idx===idx ? planDraft.data : DB.plan[idx];
  const el = document.getElementById(`pn-${idx}-${dayKey}`);
  if(el) el.textContent = compactNotation({tipo:dayKey, ...data[dayKey]});
  const footer = document.getElementById(`wk-footer-${idx}`);
  if(footer) footer.style.display = planHasChanges() ? 'flex' : 'none';
}
function savePlanWeek(idx){
  if(!planDraft || planDraft.idx!==idx) return;
  DB.plan[idx] = planDraft.data;
  persist();
  toast('Semana guardada');
  renderPlanificacion();
}
function cancelPlanWeek(idx){
  startPlanDraft(idx);
  renderPlanificacion();
}
function addPlanWeek(){
  if(!confirmDiscardPlanChanges()) return;
  const last = DB.plan[DB.plan.length-1];
  const nuevoLunes = addDays(last.lunes, 7);
  DB.plan.push({lunes:nuevoLunes, series:{...last.series}, rodaje:{...last.rodaje}, velocidad:{...last.velocidad}});
  persist();
  planOpenIdx = DB.plan.length-1;
  startPlanDraft(planOpenIdx);
  renderPlanificacion();
}
function removePlanWeekConfirm(i){
  if(!confirm('¿Eliminar esta semana del plan?')) return;
  DB.plan.splice(i,1);
  persist();
  planOpenIdx = -1;
  planDraft = null;
  renderPlanificacion();
}
function planFieldCell(idx, dayKey, field, sub, value, lbl, type){
  const parse = type==='int' ? 'parseInt(this.value,10)||0' : (type==='float' ? 'parseFloat(this.value)||0' : 'this.value');
  const inputAttrs = type==='text' ? '' : 'type="number" inputmode="decimal"';

const RAMPA = [[0,[216,56,42]],[28,[232,122,38]],[50,[236,190,46]],[68,[203,219,56]],[85,[163,222,64]],[100,[122,216,84]]];
function colorDe(p){
  p=clamp(p,0,100);
  for(let i=0;i<RAMPA.length-1;i++){
    const a=RAMPA[i], b=RAMPA[i+1];
    if(p<=b[0]){ const t=(p-a[0])/(b[0]-a[0]); return 'rgb('+[0,1,2].map(k=>Math.round(a[1][k]+(b[1][k]-a[1][k])*t)).join(',')+')'; }
  }
  return 'rgb(122,216,84)';
}
function svgLine(points, opts){
  opts = opts||{};
  const w=320, h=130, pad=14;
  let min = opts.min!=null?opts.min:Math.min(...points.map(p=>p.y));
  let max = opts.max!=null?opts.max:Math.max(...points.map(p=>p.y));
  if(min===max){min-=1;max+=1;}
  const xw = points.length>1 ? (w-2*pad)/(points.length-1) : 0;
  const toY = v => h-pad-((v-min)/(max-min))*(h-2*pad);
  const pts = points.map((p,i)=>[pad+i*xw, toY(p.y)]);
  const path = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const color = opts.color||'#fff';
  let extra='';
  if(opts.target!=null){
    const ty = toY(opts.target);
    extra += `<line x1="${pad}" y1="${ty.toFixed(1)}" x2="${w-pad}" y2="${ty.toFixed(1)}" stroke="rgba(255,255,255,.3)" stroke-width="1.5" stroke-dasharray="3 4"/>
      <text x="${w-pad}" y="${(ty-6).toFixed(1)}" text-anchor="end" font-size="10" fill="rgba(255,255,255,.55)">${opts.targetLabel||''}</text>`;
  }
  const dots = pts.map((p,i)=>{
    const r = points[i].showLabel ? 4 : 2.3;
    let lbl='';
    if(points[i].showLabel){
      lbl = `<text x="${p[0].toFixed(1)}" y="${(p[1]-9).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">${points[i].txt!=null?points[i].txt:points[i].y}</text>`;
    }
    return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${r}" fill="${color}"/>${lbl}`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">
    <path d="${path} L${pts[pts.length-1][0].toFixed(1)},${h-pad} L${pts[0][0].toFixed(1)},${h-pad} Z" fill="${color}" opacity=".10"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linecap="round" style="filter:drop-shadow(0 0 5px ${color})"/>
    ${extra}${dots}
  </svg>`;
}
function fewPointsHTML(points, opts){
  opts = opts||{};
  const fmt = opts.fmt || (v=>v);
  if(points.length===0) return `<div class="empty-mini">${opts.emptyText||'Aparece con tu primer registro'}</div>`;
  if(points.length===1){
    return `<div class="few-points"><div class="fp-item"><b>${fmt(points[0].y)}</b><span>${points[0].label}</span></div></div>`;
  }
  const a=points[0], b=points[points.length-1];
  const delta = b.y-a.y;
  const better = opts.betterLower ? delta<0 : delta>0;
  const deltaTxt = opts.deltaFmt ? opts.deltaFmt(delta) : ((delta>0?'+':'')+Math.round(delta));
  return `<div class="few-points">
    <div class="fp-item"><b>${fmt(a.y)}</b><span>${a.label}</span></div>
    <div class="fp-arrow">→</div>
    <div class="fp-item"><b>${fmt(b.y)}</b><span>${b.label}</span></div>
    <div class="fp-delta ${better?'good':'bad'}">${deltaTxt}</div>
  </div>`;
}
function adaptiveChart(points, opts){
  opts = opts||{};
  if(points.length<=2) return fewPointsHTML(points, opts);
  const pts = points.map(p=>({...p}));
  if(pts.length<=5){ pts.forEach(p=>p.showLabel=true); }
  else {
    const best = opts.betterLower ? Math.min(...pts.map(p=>p.y)) : Math.max(...pts.map(p=>p.y));
    pts.forEach((p,i)=>{ p.showLabel = (i===0||i===pts.length-1||p.y===best); });
  }
  pts.forEach(p=>{ p.txt = opts.fmt ? opts.fmt(p.y) : p.y; });
  return svgLine(pts, opts);
}

function getPR(distLabel){
  let best=null;
  if(distLabel===1000){
    DB.sesiones.filter(s=>s.tipo==='test' && s.tiempoTotal!=null).forEach(s=>{
      if(!best || s.tiempoTotal<best.valor) best={valor:s.tiempoTotal, fecha:s.fecha};
    });
  } else if(distLabel===400){
    DB.sesiones.filter(s=>s.tipo==='series' && s.tiempos && s.tiempos.length).forEach(s=>{
      const m = Math.min(...s.tiempos);
      if(!best || m<best.valor) best={valor:m, fecha:s.fecha};
    });
  } else if(distLabel===200){
    DB.sesiones.filter(s=>s.tipo==='velocidad' && s.tiempos && s.tiempos.length).forEach(s=>{
      const m = Math.min(...s.tiempos);
      if(!best || m<best.valor) best={valor:m, fecha:s.fecha};
    });
  }
  return best;
}
function renderPRGrid(){
  const items = [[1000,'1.000 m'],[400,'400 m'],[200,'200 m']];
  document.getElementById('pr-grid').innerHTML = items.map(([d,l])=>{
    const pr = getPR(d);
    const flash = window.__prFlash && window.__prFlash.dist===d && (Date.now()-window.__prFlash.ts<4000);
    return `<div class="pr-item"><div class="pr-val ${flash?'flash':''}">${pr?secToTime(pr.valor):'—'}</div><div class="pr-lbl">${l}</div><div class="pr-date">${pr?fmtDateShort(pr.fecha):'·'}</div></div>`;
  }).join('');
}

function deltaBlock(curr, prev, betterLower, fmt){
  if(curr==null) return `<div class="resumen-val" style="color:var(--text-3)">—</div><div class="resumen-delta neutral">·</div>`;
  let delta;
  if(prev!=null){
    const d = curr-prev;
    const good = betterLower ? d<0 : d>0;
    const cls = d===0?'neutral':(good?'good':'bad');
    delta = `<div class="resumen-delta ${cls}">${d===0?'=':(d>0?'+':'')+Math.round(d)}</div>`;
  } else delta = `<div class="resumen-delta neutral">·</div>`;
  return `<div class="resumen-val">${fmt(curr)}</div>${delta}`;
}

  const rodajes = DB.sesiones.filter(s=>s.tipo==='rodaje' && s.ritmo130!=null).sort((a,b)=>a.fecha<b.fecha?-1:1);
  const lastTest = tests[tests.length-1], prevTest = tests[tests.length-2];
  const lastSerie = seriesS[seriesS.length-1], prevSerie = seriesS[seriesS.length-2];
  const lastRodaje = rodajes[rodajes.length-1], prevRodaje = rodajes[rodajes.length-2];
  const caida = s => s ? s.tiempos[0]-s.tiempos[s.tiempos.length-1] : null;
  document.getElementById('resumen').innerHTML = `
    <div class="resumen-item">${deltaBlock(lastTest?lastTest.tiempoTotal:null, prevTest?prevTest.tiempoTotal:null, true, secToTime)}<div class="resumen-lbl">Último test</div></div>
    <div class="resumen-item">${deltaBlock(caida(lastSerie), caida(prevSerie), true, v=>Math.round(v)+' s')}<div class="resumen-lbl">Caída series</div></div>

  `;
}
